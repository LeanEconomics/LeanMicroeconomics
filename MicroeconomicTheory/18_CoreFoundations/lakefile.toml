name = "MWGCoreFoundations"
version = "0.1.0"
keywords = ["math", "economics", "microeconomics"]
defaultTargets = ["MWGCoreFoundations"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[require]]
name = "MWGWelfareTheorems"
path = "../16_WelfareTheorems"

[[require]]
name = "MWGWelfareBargaining"
path = "../22_WelfareBargaining"

[[lean_lib]]
name = "MWGCoreFoundations"

name = "MWGChoiceUnderUncertainty"
version = "0.1.0"
keywords = ["math", "economics", "microeconomics"]
defaultTargets = ["MWGChoiceUnderUncertainty"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[require]]
name = "MWGPreferenceChoice"
path = "../01_PreferenceChoice"

[[require]]
name = "MWGClassicalDemand"
path = "../03_ClassicalDemand"

[[require]]
name = "ChoiceUnderUncertainty"
path = "../../Volume1/05_ChoiceUnderUncertainty"

[[require]]
name = "UtilityForMoney"
path = "../../Volume1/06_UtilityForMoney"

[[lean_lib]]
name = "MWGChoiceUnderUncertainty"

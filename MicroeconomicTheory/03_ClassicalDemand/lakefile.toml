name = "MWGClassicalDemand"
version = "0.1.0"
keywords = ["math", "economics", "microeconomics"]
defaultTargets = ["MWGClassicalDemand"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[require]]
name = "MWGConsumerChoice"
path = "../02_ConsumerChoice"

[[require]]
name = "MWGPreferenceChoice"
path = "../01_PreferenceChoice"

[[require]]
name = "PreferenceProperties"
path = "../../Volume1/02_PreferenceProperties"

[[require]]
name = "ConsumerDemand"
path = "../../Volume1/03_ConsumerDemand"

[[require]]
name = "RevealedPreference"
path = "../../Volume1/04_RevealedPreference"

[[require]]
name = "ChoicePreferenceUtility"
path = "../../Volume1/01_ChoicePreferenceUtility"

[[lean_lib]]
name = "MWGClassicalDemand"
